global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # --- Web-Services nodes ---
  # Targets scraped by IP; instance label overridden to DNS name for readable alerts
  - job_name: "web-services-node"
    static_configs:
      - targets: ["107.191.43.166:9100"]
        labels:
          environment: staging
          project: web-services
          dns_name: staging-forums.wetfish.net
          instance: staging-forums.wetfish.net:9100
      - targets: ["149.28.239.165:9100"]
        labels:
          environment: production
          project: web-services
          dns_name: wetfishonline.com
          instance: wetfishonline.com:9100

  - job_name: "testforums"
    static_configs:
      - targets: ["144.202.63.236:9100"]
        labels:
          environment: production
          project: web-services
          dns_name: testforum.wetfish.net
          instance: testforum.wetfish.net:9100

  # --- Factory nodes ---
  - job_name: "factory-staging-node"
    static_configs:
      - targets: ["45.76.235.77:9100"]
        labels:
          environment: staging
          project: factory
          dns_name: staging-factory.andonalert.net
          instance: staging-factory.andonalert.net:9100

  - job_name: "factory-prod-node"
    static_configs:
      - targets: ["104.156.237.105:9100"]
        labels:
          environment: production
          project: factory
          dns_name: factory.andonalert.net
          instance: factory.andonalert.net:9100

  # --- Factory MySQL exporter ---
  - job_name: "factory-mysql-staging"
    static_configs:
      - targets: ["45.76.235.77:9104"]
        labels:
          environment: staging
          project: factory
          dns_name: staging-factory.andonalert.net
          instance: staging-factory.andonalert.net:9104

  - job_name: "factory-mysql-prod"
    static_configs:
      - targets: ["104.156.237.105:9104"]
        labels:
          environment: production
          project: factory
          dns_name: factory.andonalert.net
          instance: factory.andonalert.net:9104

  # --- Factory Redis exporter ---
  - job_name: "factory-redis-staging"
    static_configs:
      - targets: ["45.76.235.77:9121"]
        labels:
          environment: staging
          project: factory
          dns_name: staging-factory.andonalert.net
          instance: staging-factory.andonalert.net:9121

  - job_name: "factory-redis-prod"
    static_configs:
      - targets: ["104.156.237.105:9121"]
        labels:
          environment: production
          project: factory
          dns_name: factory.andonalert.net
          instance: factory.andonalert.net:9121

  # --- Factory Nginx exporter ---
  - job_name: "factory-nginx-staging"
    static_configs:
      - targets: ["45.76.235.77:9113"]
        labels:
          environment: staging
          project: factory
          dns_name: staging-factory.andonalert.net
          instance: staging-factory.andonalert.net:9113

  - job_name: "factory-nginx-prod"
    static_configs:
      - targets: ["104.156.237.105:9113"]
        labels:
          environment: production
          project: factory
          dns_name: factory.andonalert.net
          instance: factory.andonalert.net:9113

  # --- Web-Services Traefik metrics ---
  - job_name: "web-services-traefik"
    static_configs:
      - targets: ["107.191.43.166:8082"]
        labels:
          environment: staging
          project: web-services
          dns_name: staging-forums.wetfish.net
          instance: staging-forums.wetfish.net:8082
      - targets: ["149.28.239.165:8082"]
        labels:
          environment: production
          project: web-services
          dns_name: wetfishonline.com
          instance: wetfishonline.com:8082

  # --- Observability stack self-monitoring ---
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "promtail"
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "irc-relay"
    static_configs:
      - targets: ["irc-relay:8010"]

  # --- Pentest scanner metrics (via Pushgateway) ---
  # In docker-compose: pushgateway:9091
  # In k8s: pushgateway.pentest.svc.cluster.local:9091
  - job_name: "pentest"
    honor_labels: true
    scrape_interval: 30s
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          project: pentest

  # --- Web-Services-K8s Prometheus federation ---
  # Uncomment when web-services-k8s Prometheus federation endpoint is available
  # - job_name: "web-services-k8s-federation"
  #   honor_labels: true
  #   metrics_path: /federate
  #   params:
  #     match[]:
  #       - '{job=~".+"}'
  #   static_configs:
  #     - targets: ["<web-services-k8s-prometheus>:9090"]

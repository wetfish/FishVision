apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "pentest"
        honor_labels: true
        scrape_interval: 30s
        static_configs:
          - targets: ["pushgateway.pentest.svc.cluster.local:9091"]
            labels:
              project: pentest
  alert.rules.yml: |
    groups:
      - name: server-health
        rules:
          - alert: InstanceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Instance {{ $labels.instance }} down"
      - name: pentest
        rules:
          - alert: PentestCriticalRisk
            expr: pentest_risk_score > 74
            for: 5m
            labels:
              severity: critical
              project: pentest
            annotations:
              summary: "Critical risk score on {{ $labels.target }}"
              description: "Pentest risk score for {{ $labels.target }} is {{ $value }}/100 — immediate remediation required."
              runbook: "1) Check kubectl exec -n pentest deploy/pentest-frontend -- ls /output/analysis/{{ $labels.target }}/ 2) Review findings in Grafana 3) Escalate to asset owner"
          - alert: PentestSqlInjection
            expr: pentest_sqli_found > 0
            for: 0m
            labels:
              severity: critical
              project: pentest
            annotations:
              summary: "SQL injection confirmed on {{ $labels.target }}"
              description: "{{ $value }} SQL injection vulnerabilities confirmed on {{ $labels.target }} — immediate patch required."
              runbook: "1) Check sqlmap results in exploitation report 2) Verify WAF rules block injection patterns 3) Patch vulnerable endpoints"
          - alert: PentestDefaultCredentials
            expr: pentest_creds_found > 0
            for: 0m
            labels:
              severity: critical
              project: pentest
            annotations:
              summary: "Default credentials found on {{ $labels.target }}"
              description: "{{ $value }} services with default/weak credentials on {{ $labels.target }}."
              runbook: "1) Check hydra results in exploit report 2) Change passwords immediately 3) Enforce password policy"
          - alert: PentestDirectIPExposure
            expr: pentest_exploit_targets > 0
            for: 5m
            labels:
              severity: warning
              project: pentest
            annotations:
              summary: "Direct IP exposure on {{ $labels.target }}"
              description: "{{ $value }} subdomains expose direct IPs bypassing Cloudflare WAF."
              runbook: "1) Check exploit_targets.txt 2) Route subdomains through Cloudflare proxy 3) Restrict direct IP access via firewall"
          - alert: PentestHighVulnDensity
            expr: pentest_vuln_critical + pentest_vuln_high > 5
            for: 5m
            labels:
              severity: warning
              project: pentest
            annotations:
              summary: "High vulnerability density on {{ $labels.target }}"
              description: "{{ $value }} critical/high severity findings on {{ $labels.target }}."
              runbook: "1) Review nuclei findings in active report 2) Prioritize patching by CVE score 3) Schedule full remediation sprint"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules/alert.rules.yml
              subPath: alert.rules.yml
            - name: data
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
